<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Session | Project Tracker</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #050506;
            --panel: #15161b;
            --text: #f5f5f7;
            --muted: #a6a8b3;
            --accent: #ff6a00;
            --border: rgba(255,255,255,.12);
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        main {
            width: min(92vw, 460px);
            padding: 28px;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: var(--panel);
            box-shadow: 0 24px 80px rgba(0,0,0,.45);
            text-align: center;
        }
        h1 {
            margin: 0 0 12px;
            font-size: clamp(1.5rem, 5vw, 2.25rem);
            letter-spacing: -.04em;
        }
        p {
            margin: 0 0 18px;
            color: var(--muted);
            line-height: 1.5;
        }
        button, a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0 18px;
            border: 0;
            border-radius: 999px;
            background: var(--accent);
            color: #111;
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
        }
        .status {
            margin-top: 14px;
            font-size: .9rem;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <main>
        <h1>Session reset</h1>
        <p>The app cleared stored login data, local session storage, and visible legacy cookies from this browser.</p>
        <button id="continueBtn" type="button">Continue to login</button>
        <div class="status" id="statusText">Redirecting...</div>
    </main>

    <script>
        (function resetProjectTrackerSession() {
            const COOKIE_EXPIRY = 'Thu, 01 Jan 1970 00:00:00 GMT';

            function cookieDomains() {
                const host = window.location.hostname;
                if (!host || host === 'localhost' || /^\d+\.\d+\.\d+\.\d+$/.test(host)) return [null];
                const domains = [null, host, `.${host}`];
                const parts = host.split('.').filter(Boolean);
                if (parts.length > 2) {
                    const root = parts.slice(-2).join('.');
                    domains.push(root, `.${root}`);
                }
                return [...new Set(domains)];
            }

            function clearCookies() {
                const names = document.cookie
                    .split(';')
                    .map(part => part.split('=')[0]?.trim())
                    .filter(Boolean);
                const domains = cookieDomains();
                names.forEach(name => {
                    document.cookie = `${name}=; expires=${COOKIE_EXPIRY}; max-age=0; path=/; SameSite=Lax`;
                    domains.forEach(domain => {
                        if (domain) {
                            document.cookie = `${name}=; expires=${COOKIE_EXPIRY}; max-age=0; path=/; domain=${domain}; SameSite=Lax`;
                        }
                    });
                });
            }

            function clearStorage() {
                try { localStorage.clear(); } catch {}
                try { sessionStorage.clear(); } catch {}
            }

            function goHome() {
                window.location.replace('/');
            }

            clearCookies();
            clearStorage();
            document.getElementById('continueBtn')?.addEventListener('click', goHome);
            window.setTimeout(goHome, 1200);
        })();
    </script>
</body>
</html>
